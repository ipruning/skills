[project]
name = "skills"
version = "0.1.0"
description = "Skills for Amp & Codex"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "things-py==1.0.1",
    "ty>=0.0.84",
]

[tool.ruff]
exclude = [
    # BEGIN GENERATED LINT EXCLUDES: ruff
    "agent/skillshare/",
    "code/flint-chart-author/",
    "code/flint-theme-author/",
    "code/frontend-design/",
    "code/ip-as-logo/",
    "code/typesafe-ai/",
    "run/herdr/",
    "ship/code-storage/",
    "think/show-me/",
    # END GENERATED LINT EXCLUDES: ruff
]
indent-width = 4
line-length = 120
preview = true
target-version = "py314"

[tool.ruff.lint]
ignore = ["E501", "TID252"]
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
# Things uses the host's local calendar date, not a timezone-normalized instant.
"connect/things/scripts/things_query.py" = ["DTZ011"]
# Multi-line remote shell snippets and journal fixtures read better as one line per list item.
"run/proxy-fleet/**" = ["FLY002"]

[tool.ruff.format]
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.tombi.files]
exclude = [
    # BEGIN GENERATED LINT EXCLUDES: tombi
    "agent/skillshare/**",
    "code/flint-chart-author/**",
    "code/flint-theme-author/**",
    "code/frontend-design/**",
    "code/ip-as-logo/**",
    "code/typesafe-ai/**",
    "run/herdr/**",
    "ship/code-storage/**",
    "think/show-me/**",
    # END GENERATED LINT EXCLUDES: tombi
]

[tool.tombi.format.rules]
indent-style = "space"
indent-width = 4
line-width = 120

[tool.ty.environment]
python-version = "3.14"

[tool.ty.analysis]
strict-equality-semantics = true

[tool.ty.rules]
all = "error"
unresolved-import = "warn"

[tool.ty.src]
exclude = [
    # BEGIN GENERATED LINT EXCLUDES: ty
    "agent/skillshare/",
    "code/flint-chart-author/",
    "code/flint-theme-author/",
    "code/frontend-design/",
    "code/ip-as-logo/",
    "code/typesafe-ai/",
    "run/herdr/",
    "ship/code-storage/",
    "think/show-me/",
    # END GENERATED LINT EXCLUDES: ty
]
