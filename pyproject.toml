    "skills-stable/longbridge-value-investing/**",
    "skills-stable/longbridge-watchlist/**",
    "skillshare/**",
]

[tool.tombi.format.rules]
indent-style = "space"
indent-width = 4
line-width = 120

[tool.ty.environment]
python-version = "3.14"

[tool.ty.analysis]
strict-equality-semantics = true

[tool.ty.rules]
all = "error"
unresolved-import = "warn"

[tool.ty.src]
exclude = [
    "skills-beta/cascade/",
    "skills-beta/code-storage/",
