[project]
name = "skills"
version = "0.1.0"
description = "Skills for Amp & Codex"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "things-py==1.0.1",
    "ty>=0.0.84",
    "typer>=0.27.2",
]

[tool.ruff]
exclude = [
    "skills-beta/cascade/",
    "skills-beta/code-storage/",
    "skills-beta/flint-chart-author/",
    "skills-beta/flint-theme-author/",
    "skills-beta/frontend-design/",
    "skills-beta/herdr/",
    "skills-beta/ip-as-logo-skill/",
    "skills-beta/sherlog/",
    "skills-beta/show-me/",
    "skills-beta/typesafe-ai/",
    "skills-mattpocock/ask-matt/",
    "skills-mattpocock/code-review/",
    "skills-mattpocock/codebase-design/",
    "skills-mattpocock/diagnosing-bugs/",
    "skills-mattpocock/domain-modeling/",
    "skills-mattpocock/grill-me/",
    "skills-mattpocock/grill-with-docs/",
    "skills-mattpocock/grilling/",
    "skills-mattpocock/handoff/",
    "skills-mattpocock/implement/",
    "skills-mattpocock/improve-codebase-architecture/",
    "skills-mattpocock/prototype/",
    "skills-mattpocock/research/",
    "skills-mattpocock/setup-matt-pocock-skills/",
    "skills-mattpocock/tdd/",
    "skills-mattpocock/teach/",
    "skills-mattpocock/triage/",
    "skills-stable/longbridge/",
    "skills-stable/longbridge-content/",
    "skills-stable/longbridge-derivatives/",
    "skills-stable/longbridge-earnings/",
    "skills-stable/longbridge-fundamentals/",
    "skills-stable/longbridge-intel/",
    "skills-stable/longbridge-market-data/",
    "skills-stable/longbridge-portfolio/",
    "skills-stable/longbridge-quant/",
    "skills-stable/longbridge-research/",
    "skills-stable/longbridge-technical/",
    "skills-stable/longbridge-value-investing/",
    "skills-stable/longbridge-watchlist/",
    "skillshare/",
]
indent-width = 4
line-length = 120
preview = true
target-version = "py314"

[tool.ruff.lint]
ignore = ["E501", "TID252"]
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
# Things uses the host's local calendar date, not a timezone-normalized instant.
"skills-beta/things/scripts/things_query.py" = ["DTZ011"]
# Multi-line remote shell snippets and journal fixtures read better as one line per list item.
"skills-stable/operate-proxy-fleet/**" = ["FLY002"]

[tool.ruff.format]
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.tombi.files]
exclude = [
    "skills-beta/cascade/**",
    "skills-beta/code-storage/**",
    "skills-beta/flint-chart-author/**",
    "skills-beta/flint-theme-author/**",
