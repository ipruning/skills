interface:
  display_name: "JetKVM Tailscale 运维"
  short_description: "安装、升级、修复和验证 JetKVM 的 Tailscale、tailnet 内 HTTPS Serve 与持久化"
  default_prompt: >-
    使用 $operating-jetkvm-tailscale 运维 JetKVM 上的 Tailscale 远程访问，诊断 HTTPS
    Certificates、Serve、证书签发、精简固件兼容与重启持久化。该 Skill 保持服务只对
    tailnet 开放，不配置 Funnel 公网发布。
