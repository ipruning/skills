# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit", "pre-push"]
# BEGIN GENERATED LINT EXCLUDES: prek
exclude = "^agent/sherlog/|^agent/skillshare/|^code/flint\\-chart\\-author/|^code/flint\\-theme\\-author/|^code/frontend\\-design/|^code/ip\\-as\\-logo/|^code/typesafe\\-ai/|^run/herdr/|^ship/code\\-storage/|^think/show\\-me/"
# END GENERATED LINT EXCLUDES: prek
fail_fast = false

# =============================================================================
# Priority Layout:
#   0  — Gate checks (fast, fail-fast guards)
#   20 — All read-only checks (run concurrently)
# =============================================================================

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "check-yaml", name = "check YAML files", stages = ["pre-commit", "pre-push"], priority = 20 },
    { id = "check-ast", name = "check ast", stages = ["pre-commit", "pre-push"], priority = 20 },
    {
        id = "check-merge-conflict",
        name = "check merge conflict",
        stages = ["pre-commit", "pre-push"],
        priority = 20
    },
    {
        id = "check-shebang-scripts-are-executable",
        name = "check shebang scripts are executable",
        stages = ["pre-commit"],
        priority = 20
    },
    {
        id = "check-added-large-files",
        name = "check added large files",
        stages = ["pre-commit", "pre-push"],
        args = ["--maxkb=4096"],
        priority = 20
    },
    { id = "check-symlinks", name = "check symlinks", stages = ["pre-commit", "pre-push"], priority = 20 },
    {
        id = "destroyed-symlinks",
        name = "destroyed symlinks",
        require_serial = true,
        stages = ["pre-commit", "pre-push"],
        priority = 20
    },
    {
        id = "detect-private-key",
        name = "detect private key",
        stages = ["pre-commit", "pre-push"],
        priority = 20
    }
]

[[repos]]
repo = "https://github.com/sirwart/ripsecrets"
rev = "v0.1.11"
hooks = [
    {
        id = "ripsecrets",
        name = "ripsecrets",
        args = [
            "--strict-ignore",
            "--additional-pattern",
            "sk-proj-[A-Za-z0-9_-]{20,}",
            "--additional-pattern",
            "xai-[A-Za-z0-9]{20,}",
            "--additional-pattern",
            "fc-[A-Za-z0-9]{20,}",
            "--additional-pattern",
            "tpuf_[A-Za-z0-9]{20,}",
            "--additional-pattern",
            "pylf_v1_[a-z]+_[A-Za-z0-9]{20,}"
        ],
        require_serial = true,
        stages = ["pre-commit", "pre-push"],
        priority = 20
    }
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.51.1"
hooks = [{ id = "typos", name = "typos", stages = ["pre-push"], priority = 20 }]

[[repos]]
repo = "local"
hooks = [
    {
        id = "biome-ci",
        name = "biome check",
        entry = "mise exec -- biome ci --files-ignore-unknown=true --no-errors-on-unmatched",
        language = "system",
        types = ["text"],
        files = '\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\.(ts|cts|mts)|jsonc?|css|svelte|vue|astro|graphql|gql)$',
        require_serial = true,
        stages = ["pre-push"],
        priority = 20
    },
    {
        id = "markdownlint-cli2",
        name = "markdownlint-cli2",
        entry = "mise exec -- markdownlint-cli2",
        language = "system",
        types = ["markdown"],
        pass_filenames = false,
        stages = ["pre-push"],
        priority = 20
    },
    {
        id = "ruff-check",
        name = "ruff check",
        entry = "uv run --locked ruff check --force-exclude",
        language = "system",
        types = ["python"],
        stages = ["pre-commit"],
        priority = 20
    },
    {
        id = "ruff-format",
        name = "ruff format",
        entry = "uv run --locked ruff format --check --force-exclude",
        language = "system",
        types = ["python"],
        stages = ["pre-commit"],
        priority = 20
    },
    {
        id = "ty",
        name = "ty",
        entry = "uv run --locked ty check",
        language = "system",
        pass_filenames = false,
        stages = ["pre-push"],
        priority = 20
    },
    {
        id = "check-lint-excludes",
        name = "lint excludes match .metadata.json",
        entry = "mise run check-lint-excludes",
        language = "system",
        pass_filenames = false,
        always_run = true,
        stages = ["pre-commit", "pre-push"],
        priority = 0
    },
    {
        id = "check-file-hygiene",
        name = "check trailing whitespace and end of file",
        entry = "uv run --script scripts/check-file-hygiene.py",
        language = "system",
        types = ["text"],
        stages = ["pre-commit"],
        priority = 20
    },
    {
        id = "shellcheck",
        name = "shellcheck",
        entry = "mise exec -- shellcheck",
        language = "system",
        types = ["shell"],
        stages = ["pre-commit"],
        priority = 20
    },
    {
        id = "autocorrect",
        name = "autocorrect",
        entry = "mise exec -- autocorrect --lint . scripts/",
        language = "system",
        pass_filenames = false,
        stages = ["pre-push"],
        priority = 20
    },
    {
        id = "actionlint",
        name = "actionlint",
        entry = "mise exec -- actionlint",
        language = "system",
        files = '^\.github/workflows/.*\.ya?ml$',
        stages = ["pre-push"],
        priority = 20
    },
    {
        id = "tombi",
        name = "tombi",
        entry = "mise exec -- tombi lint .",
        language = "system",
        pass_filenames = false,
        types = ["toml"],
        stages = ["pre-push"],
        priority = 20
    },
    {
        id = "ls-lint",
        name = "ls-lint",
        entry = "mise exec -- ls-lint",
        language = "system",
        pass_filenames = false,
        always_run = true,
        stages = ["pre-push"],
        priority = 20
    },
]
