min_version = { hard = "2026.10.13" }

[tool_alias]
skillshare = "aqua:runkids/skillshare"
uv = "aqua:astral-sh/uv"

[tools]
"github:huacnlee/autocorrect" = "2.16.3"
actionlint = "1.7.12"
biome = "2.5.15"
jq = "1.8.2"
ls-lint = "2.3.2"
markdownlint-cli2 = "0.23.3"
node = "26.12.0"
prek = "0.5.5"
python = "3.15.0"
shellcheck = "0.11.0"
skillshare = "0.25.13"
tombi = "1.8.7"
usage = "7.0.2"
uv = "0.13.1"

[env]
_.python.venv = { path = ".venv" }
TOMBI_SCHEMA_TRUSTED_HOSTS = "www.schemastore.org,mise.jdx.dev,raw.githubusercontent.com"

[settings]
auto_install = false
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[tasks.check-lint-excludes]
description = "Verify generated lint exclusions match Skillshare metadata"
run = "python scripts/lint-excludes.py"

[tasks.update-lint-excludes]
description = "Regenerate lint exclusions from Skillshare metadata"
run = "python scripts/lint-excludes.py --write"

[tasks.format]
description = "Run formatters"
run = "scripts/format.sh"

[tasks.lint]
description = "Run linters"
run = "scripts/lint.sh"

[tasks.test]
description = "Run repository script tests"
run = "scripts/test.sh"
