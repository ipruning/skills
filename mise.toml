min_version = { hard = "2026.9.11" }

[tool_alias]
skillshare = "aqua:runkids/skillshare"
uv = "aqua:astral-sh/uv"

[tools]
"github:huacnlee/autocorrect" = "2.16.3"
actionlint = "1.7.12"
biome = "2.5.14"
gum = "2.0.1"
jq = "1.8.2"
ls-lint = "2.3.1"
markdownlint-cli2 = "0.23.2"
prek = "0.5.3"
python = "3.14.7"
shellcheck = "0.11.0"
skillshare = "0.21.0"
tombi = "1.5.5"
usage = "6.10.0"
uv = "0.12.17"

[env]
_.python.venv = { path = ".venv" }

[settings]
auto_install = false
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[settings.ruby]
compile = false

[tasks.check-lint-excludes]
description = "Verify lint config excludes match the non-_ .metadata.json entries"
run = "scripts/check-lint-excludes.sh"

[tasks.format]
description = "Run formatters"
run = "scripts/format.sh"

[tasks.lint]
description = "Run linters"
run = "scripts/lint.sh"
